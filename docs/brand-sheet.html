<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAANVIKA Brand Sheet</title>
<style>
  body{margin:0;font-family:Inter,'Segoe UI',Arial,sans-serif;background:#F5F7FA;color:#101D35}
  .row{display:flex;flex-wrap:wrap;gap:24px;padding:32px}
  .tile{background:#fff;border-radius:16px;padding:32px;display:grid;place-items:center;min-width:200px}
  .dark{background:#101D35}
  h2{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#778397;margin:24px 32px 0}
  .sw{width:120px;height:80px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font-size:12px;box-sizing:border-box}
</style>
</head>
<body>
<h2>Primary logo</h2>
<div class="row">
  <div class="tile"><img src="../assets/brand/logo-primary.svg" width="320" alt="Primary logo"></div>
  <div class="tile dark"><img src="../assets/brand/logo-primary-white.svg" width="320" alt="White logo"></div>
</div>
<h2>Monogram</h2>
<div class="row">
  <div class="tile"><img src="../assets/brand/monogram.svg" width="160" alt="Monogram"></div>
  <div class="tile dark"><img src="../assets/brand/monogram-white.svg" width="160" alt="Monogram white"></div>
  <div class="tile"><img src="../assets/brand/favicon.svg" width="96" alt="Favicon"> <img src="../assets/brand/favicon.svg" width="32" alt=""> <img src="../assets/brand/favicon.svg" width="16" alt=""></div>
</div>
<h2>Palette</h2>
<div class="row">
  <div class="sw" style="background:#101D35;color:#fff">Midnight Navy #101D35</div>
  <div class="sw" style="background:#18B7A7;color:#101D35">Premium Teal #18B7A7</div>
  <div class="sw" style="background:#243247;color:#fff">Graphite #243247</div>
  <div class="sw" style="background:#F5F7FA;border:1px solid #ddd">Soft White #F5F7FA</div>
  <div class="sw" style="background:#fff;border:1px solid #ddd">Pure White #FFFFFF</div>
  <div class="sw" style="background:#778397;color:#fff">Muted Gray #778397</div>
</div>
</body>
</html>
