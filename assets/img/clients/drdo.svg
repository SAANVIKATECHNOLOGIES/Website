    <!-- Official DRDO Defence Crest -->
    <circle cx="26" cy="26" r="24" fill="#002B49"/>
    <circle cx="26" cy="26" r="21" fill="#FFFFFF"/>
    <circle cx="26" cy="26" r="19" fill="#002B49"/>
