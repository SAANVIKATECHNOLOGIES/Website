  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#F5F7FA;color:#243247;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}

    svg{width:72px;height:72px;margin:0 auto 24px;display:block}
    .code{font-size:.85rem;font-weight:600;letter-spacing:.14em;color:#0B7A70;text-transform:uppercase}

    p{color:#56627A;line-height:1.6}
    a.btn{display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;margin-top:12px;border-radius:12px;
      background:#101D35;color:#fff;font-weight:600;text-decoration:none}
    a.btn:hover{background:#172744}
    a.btn:focus-visible{outline:3px solid #18B7A7;outline-offset:3px}
  </style>
</head>

  <main class="card">
    <svg viewBox="0 0 64 64" aria-hidden="true">

      <circle cx="16" cy="52" r="4.5" fill="#18B7A7"/>
